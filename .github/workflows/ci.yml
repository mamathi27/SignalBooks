name: CI

on: [push, pull_request]

jobs:
  test:
    name: Python Tests and Lint
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Run Ruff
        run: ruff check .

      - name: Run tests
        run: pytest -q

  docker:
    name: Docker Build and Smoke Test
    runs-on: ubuntu-latest
    needs: test

    steps:
      - uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -t signalbooks:ci .

      - name: Start container
        run: docker run -d --name signalbooks -p 8000:8000 signalbooks:ci

      - name: Wait for application
        run: |
          for i in {1..20}; do
            if curl --fail http://localhost:8000/health; then
              exit 0
            fi
            sleep 2
          done
          docker logs signalbooks
          exit 1

      - name: Stop container
        if: always()
        run: docker rm -f signalbooks || true
